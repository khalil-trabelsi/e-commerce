<mat-form-field style="width: 100%;">
    <mat-label>{{label()}}</mat-label>
    <mat-select #select [multiple]="multiple()" panelClass="overlay-panel" [required]="required()" [formControl]="selectedOptionsControl" class="select" [matTooltip]="toolTip">
      <div class="box-search" >
        @if (multiple()) {
          <mat-checkbox class="check" [formControl]="selectAll" (change)="toggleSelectAll($event.checked)"></mat-checkbox>
        }
        <input [ngClass]="multiple() ? '' : 'input-search-icon' " type="text" placeholder="..." [formControl]="searchFormControl">
        <span *ngIf="searchFormControl.value !== ''" class="material-symbols-outlined icon" (click)="clear()">
          close
        </span>
      </div>
      @for (option of filteredOptions(); track option) {
    <mat-option [title]="option[key()]" class="option" [value]="option[optionId()]">{{option[key()]}}</mat-option>
  }
  </mat-select>
</mat-form-field>
