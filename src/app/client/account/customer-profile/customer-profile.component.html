<section class="dash-container">
    <mat-tab-group dynamicHeight>
        <mat-tab>
            <ng-template mat-tab-label>
            <mat-icon class="tab-icon"><span class="material-symbols-outlined">
                cinematic_blur
            </span></mat-icon>
            Mes informations personnelles
            </ng-template>
            <div class="account-wrapper">
                <form [formGroup]="userInfosForm" novalidate>
                    <div class="row mb-3">
                        <label class="col-sm-2" for="">Titre:</label>
                        <div class="col-sm-10">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"  id="genderOption1" value="male" formControlName="gender">
                            <label class="form-check-label" for="genderOption1">M</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="genderOption2" value="female" formControlName="gender">
                            <label class="form-check-label" for="genderOption2">Mme</label>
                        </div> 
                        </div>
                    </div>                                  
                    <div class="row mb-3">
                        <label for="lastName" class="col-md-2 col-form-label">Nom</label>
                        <div class="col-md-10">
                            <input type="text" class="form-control" id="lastName" formControlName="lastName" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="firstName" class="col-sm-2 col-form-label">Prénom</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="firstName" formControlName="firstName" required>
                        </div>
                    </div>                    
                    <div class="row mb-3">
                        <label for="firstName" class="col-sm-2 col-form-label">Date de naissance</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="birthdate" placeholder="YYYY-MM-DD" formControlName="birthdate" required>
                            <div id="emailHelp" class="form-text">(Ex: 1970-01-01)</div>
                        </div>
                    </div>
                    <div class="action-forms">
                        <button class="btn btn-primary">Enregistrer</button>
                    </div>          
                </form>
            </div>
 
        </mat-tab>        
        <mat-tab>
            <ng-template mat-tab-label>
            <mat-icon class="tab-icon">contact_mail</mat-icon>
            Mon email
            </ng-template>
            <div class="">
                <form action="">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" class="form-control">
                    </div>
                </form>
            </div>
        </mat-tab>

        <mat-tab>
            <ng-template mat-tab-label>
            <mat-icon class="tab-icon">lock</mat-icon>
            Mon mot de passe
            </ng-template>
            Content 2
        </mat-tab>
    </mat-tab-group>
</section>
