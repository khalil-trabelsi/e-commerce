<div class="chat-room">
    <div class="card chat-wrapper">
        <div class="card-header d-flex align-items-center justify-content-between p-1">
            <div>
                <strong>Sujet:</strong> {{chat?.subject}}
                <div>
                    <strong>De:</strong> {{receiver.email}}
                </div> 
            </div>                   
            <span class="card-subtitle">
                {{ chat?.created_at }}                        
            </span>
        </div>
        <div #chatContainer class="card-body discussion-row">
            <ul class="d-flex flex-column gap-2">
                <li *ngFor="let msg of messages" 
                    class="message" 
                    [class.sent-message]="msg.sender_id === senderId"
                    [class.received-message]="msg.sender_id !== senderId">
                        {{msg.content}}
                </li>
            </ul>
        </div>
    </div>
    <form action="">
        <div class="form-group input-wrapper">
            <input [(ngModel)]="inputMessage" type="text" class="form-control" [autocomplete]="false" id="message" name="inputMessage" placeholder="Your message">
            <button mat-button type="submit" (click)="sendMessage($event)">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>

    </form>
</div>
