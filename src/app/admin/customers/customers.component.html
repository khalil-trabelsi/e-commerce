<div class="dash-container">
    <section class="dash-title">
        <h1>Customers</h1>
    </section>
    <section>
        <button class="btn-add btn-primary" (click)="addCustomer()">
            <span class="material-symbols-outlined">
                add
            </span>
                New Customer
        </button>
    </section>
    <section>
        <mat-card appearance="outlined">
            <mat-card-content>
                <table mat-table [dataSource]="dataSource">
                    <ng-container matColumnDef="id">
                        <th mat-header-cell *matHeaderCellDef>#</th>
                        <td mat-cell *matCellDef="let element">{{element.id}}</td>
                    </ng-container>
                    <ng-container matColumnDef="first_name">
                        <th mat-header-cell *matHeaderCellDef>First name</th>
                        <td mat-cell *matCellDef="let element">{{element.first_name}}</td>
                    </ng-container>
                    <ng-container matColumnDef="last_name">
                        <th mat-header-cell *matHeaderCellDef>Last name</th>
                        <td mat-cell *matCellDef="let element">{{element.last_name}}</td>
                    </ng-container>
                    <ng-container matColumnDef="gender">
                        <th mat-header-cell *matHeaderCellDef>Gender</th>
                        <td mat-cell *matCellDef="let element">{{element.gender}}</td>
                    </ng-container>
                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef>Status</th>
                        <td mat-cell *matCellDef="let element">{{element.status}}</td>
                    </ng-container>
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef>Email</th>
                        <td mat-cell *matCellDef="let element">{{element.email}}</td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Actions</th>
                        <td class="d-flex align-items-center" mat-cell *matCellDef="let element">
                            <button class="btn">
                                <span style="font-size: 1.5rem;" class="material-symbols-outlined text-info">
                                    edit_square
                                </span>
                            </button>
                            <button class="btn">
                                <span style="font-size: 1.5rem;" class="material-symbols-outlined text-danger">
                                    delete
                                </span>
                            </button>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
        
                </table>
                <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 15]"  ></mat-paginator>
            </mat-card-content>
        </mat-card>       

    </section>
</div>
